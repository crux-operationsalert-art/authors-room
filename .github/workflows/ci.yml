name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Postgres 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Database tests
        run: ./local/test.sh
      - name: Worker tests
        working-directory: worker
        run: npm ci && npm test && npm run typecheck
      - name: Web build
        working-directory: web
        env: { NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co, NEXT_PUBLIC_SUPABASE_ANON_KEY: ci }
        run: npm ci && npx next build
